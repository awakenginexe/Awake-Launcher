name: Awake build
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: awake-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          modules: qtnetworkauth qtimageformats
          setup-python: false
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
          cache: true
      - name: Configure
        run: cmake --preset windows_msvc -DLauncher_BUILD_PLATFORM=development -DLauncher_BUILD_ARTIFACT= -DVCPKG_TARGET_TRIPLET=x64-windows -DENABLE_LTO=OFF
      - name: Build
        run: cmake --build --preset windows_msvc --config Release --parallel 4
      - name: Test
        run: ctest --preset windows_msvc --build-config Release
      - name: Package portable development build
        run: |
          cmake --install build --config Release --prefix install
          cmake --install build --config Release --prefix install --component portable
      - uses: actions/upload-artifact@v4
        with:
          name: AwakeLauncher-Windows-development
          path: install/
          if-no-files-found: error
