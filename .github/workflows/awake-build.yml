name: Awake Windows release
run-name: Release ${{ github.ref_name }} for Windows

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: awake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_MAX_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate release configuration
        env:
          AWAKE_CURSEFORGE_API_KEY: ${{ secrets.AWAKE_CURSEFORGE_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AWAKE_CURSEFORGE_API_KEY)) {
            throw 'Set the AWAKE_CURSEFORGE_API_KEY repository secret before releasing.'
          }
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Release tags must use vMAJOR.MINOR.PATCH, such as v0.1.0.'
          }
          $source = Get-Content CMakeLists.txt -Raw
          $parts = foreach ($part in 'MAJOR', 'MINOR', 'PATCH') {
            $match = [regex]::Match($source, "set\(Launcher_VERSION_$part\s+(\d+)\)")
            if (!$match.Success) { throw "Missing launcher version component: $part" }
            $match.Groups[1].Value
          }
          if ($env:GITHUB_REF_NAME -ne "v$($parts -join '.')") {
            throw 'The release tag must match the launcher version in CMakeLists.txt.'
          }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: launcher/awake-web/package-lock.json
      - name: Install Qt
        run: |
          python -m pip install "git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m aqt install-qt windows desktop 6.11.2 win64_msvc2022_64 -O "$env:RUNNER_TEMP/Qt" -m qtnetworkauth qtimageformats qtwebengine qtwebchannel qtpositioning qttasktree
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "CMAKE_PREFIX_PATH=$env:RUNNER_TEMP/Qt/6.11.2/msvc2022_64" >> $env:GITHUB_ENV
          "$env:RUNNER_TEMP/Qt/6.11.2/msvc2022_64/bin" >> $env:GITHUB_PATH
      - name: Configure
        env:
          AWAKE_CURSEFORGE_API_KEY: ${{ secrets.AWAKE_CURSEFORGE_API_KEY }}
        run: |
          cmake --preset windows_msvc -DVCPKG_TARGET_TRIPLET=x64-windows -DLauncher_BUILD_PLATFORM=release -DLauncher_BUILD_ARTIFACT= -DENABLE_LTO=OFF "-DLauncher_CURSEFORGE_API_KEY=$env:AWAKE_CURSEFORGE_API_KEY"
      - name: Build
        run: cmake --build --preset windows_msvc --config Release --parallel 4
      - name: Test
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE/build/vcpkg_installed/x64-windows/bin;$env:PATH"
          ctest --preset windows_msvc --build-config Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix launcher/awake-web test
      - name: Package Windows x64 builds
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE/build/vcpkg_installed/x64-windows/bin;$env:PATH"
          cmake --install build --config Release --prefix install
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $crt = Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC143.CRT'
          if (!(Test-Path $crt)) { throw 'Microsoft C++ runtime files were not found.' }
          Copy-Item "$crt/*.dll" install/
          foreach ($required in @(
            'awakelauncher.exe', 'QtWebEngineProcess.exe', 'Qt6WebEngineCore.dll',
            'resources/icudtl.dat', 'resources/qtwebengine_resources.pak',
            'translations/qtwebengine_locales/en-US.pak', 'translations/qtwebengine_locales/th.pak',
            'translations/qtwebengine_locales/zh-CN.pak', 'translations/qtwebengine_locales/zh-TW.pak'
          )) {
            if (!(Test-Path "install/$required")) { throw "Package is missing $required" }
          }
          New-Item -ItemType Directory -Path dist | Out-Null
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (!(Test-Path $nsis)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          ./scripts/package-windows-setup.ps1 -PackageDir install -Version $env:GITHUB_REF_NAME.Substring(1) -OutputDir dist -MakeNsis $nsis
          ./scripts/test-windows-setup.ps1 -Installer "dist/Awake-Launcher-$env:GITHUB_REF_NAME-Windows-x64-Setup.exe" -PackageDir install -TestDir "$env:RUNNER_TEMP/Awake-Launcher-setup-test"
          cmake --install build --config Release --prefix install --component portable
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $archive = "dist/Awake-Launcher-$env:GITHUB_REF_NAME-Windows-x64.zip"
          Compress-Archive -Path install/* -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content "$archive.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Awake-Launcher-${{ github.ref_name }}-Windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @'
          Awake Launcher v0.6.0 reduces background loading work with the 1080p Minecraft wallpaper and reuses the bundled image instead of encoding and animating it again on every refresh. The renderer stays suspended when loading finishes while the launcher is minimized.

          Required mod downloads are checked in both the configured download folder and the current system Downloads folder. New or changed files are rescanned automatically, including files that finish downloading without another directory notification.

          Windows x64: download the Setup.exe for a per-user installation with a Start Menu shortcut and uninstaller. Close Awake Launcher before updating. Installed accounts and instances are preserved.

          Download the Windows ZIP, extract the entire folder, then run `awakelauncher.exe`.
          Keep all extracted files together. Portable builds store accounts and instances beside the app.

          Update downloads open in your browser. Setup and portable downloads are selected to match your installation. Existing v0.2.0 builds need to be upgraded manually to receive the update checker.

          Each download has a `.sha256` checksum. This release is unsigned.
          '@ | Set-Content $notes -Encoding utf8
          $assets = @(Get-ChildItem dist -File | Where-Object Extension -In '.exe', '.zip', '.sha256' | Select-Object -ExpandProperty FullName)
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "Awake Launcher $env:GITHUB_REF_NAME" --notes-file $notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
