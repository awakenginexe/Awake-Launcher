<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="atmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="atmBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#090d16" stroke="#ca8a04" stroke-width="2"/>
  <!-- Star Pyramid Core -->
  <polygon points="32,8 54,48 10,48" fill="url(#atmBlue)" stroke="url(#atmGold)" stroke-width="2"/>
  <!-- Facet lines -->
  <line x1="32" y1="8" x2="32" y2="48" stroke="url(#atmGold)" stroke-width="1.5"/>
  <line x1="32" y1="28" x2="10" y2="48" stroke="url(#atmGold)" stroke-width="1"/>
  <line x1="32" y1="28" x2="54" y2="48" stroke="url(#atmGold)" stroke-width="1"/>
  <!-- Center '9' emblem badge -->
  <circle cx="32" cy="34" r="9" fill="#090d16" stroke="url(#atmGold)" stroke-width="1.5"/>
  <text x="32" y="38" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#facc15" text-anchor="middle">9</text>
</svg>
